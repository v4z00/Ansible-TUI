[package]
name = "ansible-tui"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Terminaloberfläche für Ansible mit optionaler Docker- und tmux-Integration"
repository = "https://github.com/v4z00/Ansible-TUI"

[[bin]]
name = "ansible-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = "0.29"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
chrono = "0.4"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
